on:
  push:
    branches:
      - main
      - "release/**"
    paths:
      - "src/**"
  pull_request:
    branches:
      - main
      - "release/**"

jobs:
  test:
       run-on: ubuntu-latest
       steps:
      - name: checkout code
        uses: actions/checkout@v4.4.0
      - name: Run tests
        run: npm test
